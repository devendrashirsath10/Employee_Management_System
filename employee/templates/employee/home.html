<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
</head>
<body>
    <h2>Employee Management System</h2>
    <a href="{% url 'add.html' %}">Add Employee</a>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>Salary</th>
            <th>Actions</th>
        </tr>

        {% for emp in employees %}
        <tr>
            <td>{{emp.id}}</td>
            <td>{{ emp.name}}</td>
            <td>{{ emp.email}}</td>
            <td>{{ emp.department}}</td>
            <td>{{ emp.salary}}</td>

            <td><a href="{% url 'update.html' emp.id %}">Edit</a></td>

            <td><a href="{% url 'delete.html' emp.id %}">Delete</a></td>
        </tr>
        {% endfor %}
    </table>
    
</body>
</html>
